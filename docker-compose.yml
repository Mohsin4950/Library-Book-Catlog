# R4 - Deployment & Monitoring: API + Prometheus + Grafana
# Start:  docker compose up -d
# Stop:   docker compose down
services:
  app:
    # Image built and pushed to Docker Hub by the R3 GitHub Actions pipeline
    image: mo53/library-book-catalog:latest
    platform: linux/amd64
    container_name: library-app
    ports:
      - "5000:5000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    environment:
      # Dashboards can be viewed without logging in; editing still needs the admin login
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
